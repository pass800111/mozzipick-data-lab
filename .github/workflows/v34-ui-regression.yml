name: V3.4 UI regression
on:
  push:
    branches: [main]
    paths:
      - "menu-renewal.js"
      - "v33.css"
      - "index.html"
      - "data/instagram-electronics.json"
      - "data/products.json"
      - "scripts/qa-v34-ui.mjs"
      - ".github/workflows/v34-ui-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Start local V3.4 site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mozzipick-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Validate product, sorting, Instagram, command and production flows
        run: node scripts/qa-v34-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-ui-screenshots
          path: qa-v34-*.png
          if-no-files-found: ignore
