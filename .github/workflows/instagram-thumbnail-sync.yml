name: Instagram free-mode data QA
on:
  push:
    branches: [main]
    paths:
      - "data/instagram-electronics.json"
      - "scripts/merge-instagram-thumbnails.mjs"
      - "scripts/test-instagram-thumbnail-sync.mjs"
      - ".github/workflows/instagram-thumbnail-sync.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Offline thumbnail metadata regression
        run: node scripts/test-instagram-thumbnail-sync.mjs
      - name: Check post identity without network or paid API
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const d=JSON.parse(fs.readFileSync("data/instagram-electronics.json","utf8"));
            const rows=[...(d.domestic||[]),...(d.overseas||[])];
            const urls=rows.map(x=>(x.reel||"").match(/instagram\.com\/(?:p|reel)\/([A-Za-z0-9_-]+)/)?.[1]||"");
            if(urls.some(x=>!x)||new Set(urls).size!==rows.length)process.exit(1);
            console.log("PASS: domestic",d.domestic.length,"overseas",d.overseas.length,"unique original post URLs",urls.length);
          '
