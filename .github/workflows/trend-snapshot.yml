name: Trend Snapshot
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append hourly KST ranking snapshot
        run: |
          python - <<'PY'
          import json,datetime
          from zoneinfo import ZoneInfo
          with open('data/products.json',encoding='utf-8') as f: p=json.load(f)
          fpath='data/trend-snapshots.json'
          with open(fpath,encoding='utf-8') as f: d=json.load(f)
          kst=ZoneInfo('Asia/Seoul')
          now=datetime.datetime.now(kst).replace(microsecond=0).isoformat()
          ranking=[{'id':x['id'],'rank':x.get('rank',i+1)} for i,x in enumerate(p.get('products',[]))]
          d.setdefault('snapshots',[]).append({'at':now,'ranking':ranking})
          cutoff=datetime.datetime.now(kst)-datetime.timedelta(days=370)
          kept=[]
          for x in d['snapshots']:
              try:
                  t=datetime.datetime.fromisoformat(x['at'].replace('Z','+00:00'))
                  if t.tzinfo is None: t=t.replace(tzinfo=kst)
                  if t.astimezone(kst)>=cutoff: kept.append(x)
              except Exception: pass
          d['snapshots']=kept
          d['updatedAt']=now
          with open(fpath,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2)
          print('captured',len(ranking),'products at',now)
          PY
      - name: Commit snapshot
        run: |
          git config user.name "mozzipick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trend-snapshots.json
          git diff --cached --quiet || git commit -m "chore: capture hourly KST trend snapshot"
          git push
