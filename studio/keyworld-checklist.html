<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEY WORLD 단계별 체크리스트</title><style>:root{--bg:#0b1020;--panel:#121a2f;--line:#2b3757;--text:#f4f7ff;--muted:#9eabc6;--accent:#7c9cff;--ok:#37c991;--warn:#ffcc66}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0f1d,#0d1426 55%,#0a0f1d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:rgba(18,26,47,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.done{border-color:var(--ok)}.next{border-color:var(--warn)}h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);font-size:13px}.stage{font-size:12px;margin-bottom:10px}.done .stage{color:#7be0b5}.next .stage{color:#ffe3a1}.summary{white-space:pre-wrap;background:#0e1629;border:1px solid #33415f;border-radius:12px;padding:14px;font-size:13px;line-height:1.72;color:#dce5ff}.btn{border:0;border-radius:12px;padding:10px 14px;background:#202b49;color:#dce5ff;border:1px solid #334163;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.saved{color:var(--ok);font-size:13px}details summary{cursor:pointer;font-weight:800;color:#dce5ff}</style></head><body><div class="wrap"><h1>KEY WORLD 단계별 체크리스트</h1><p>결정이 확정되면 에이스가 완료 처리하고 다음 단계로 넘깁니다.</p><details class="card done"><summary>✓ 6단계 완료 · 맵 · 동선 · 연속성 설계</summary><div id="stage6" class="summary" style="margin-top:12px"></div></details><div class="card done"><div class="stage">✓ 7단계 완료 · 5분 스토리 구조</div><div id="stage7" class="summary"></div></div><div class="card next"><div class="stage">● 다음 단계 · 8. 스토리보드 CUT</div><b>다음 작업은 확정 스토리를 씬 → 샷 단위로 쪼개는 것입니다.</b><p>먼저 러프 스토리보드 CUT으로 구도·동선·감정·재난 연속성을 확인한 뒤 FINAL 레퍼런스로 넘어갑니다.</p></div><div class="bar"><span class="saved" id="state">✓ 7단계 확정 저장됨</span><a class="btn" href="./roadmap.html">제작 로드맵</a><a class="btn" href="./">작업실</a></div></div><script>const KEY='ai-video-studio-v01';const STAGE6=`• 중앙 코어: 돔 정중앙\n• 구조대 기지: 중앙 코어 바로 옆\n• 고속열차역: 돔 가장자리 출구 직결역\n• 생활구역: 방사형 + 다층 테라스형 도시\n• 대피: 소형역 분산 집결 또는 중앙역 직행의 2중 대피 체계\n• 보조통로 없음, 열차 중심\n• 게이트 진입 후 초고속 튜브로 다른 키월드 이동\n• 최초 위험구역: 중앙 코어 주변 + 돔 상층/천장\n• 핵심 재난 비주얼: 중앙 코어 천장이 붕괴되며 아래로 내려앉음`;const STAGE7=`• 시작: 중앙 코어의 웅장한 전경 → Q 키월드의 평화로운 아침 → 구조대 5명의 영화 같은 일상 코미디\n• 구조대: 투닥거림 / 집중 / 실수 / 겁쟁이 신입의 숨는 행동 등 캐릭터 코미디를 자연스럽게 소개\n• 아침 임무: 게이트 정기점검을 위해 출동\n• 이동 중 작은 생활사고를 구조하고 축제·출근 혼잡 지역의 질서 정리에도 도움\n• 점검 종료 직전 미세한 이상신호가 발생하지만 곧 사라져 모두 안도\n• 복선: 점검 중 게이트 전원을 껐지만 사고뭉치 힘캐가 재가동을 깜빡함\n• 첫 재난: 중앙 코어 조명 이상 → 미세진동 → 통신 끊김 → 붉은 경보등 → 강한 충격으로 B 시나리오 진행\n• 대피 시작 후 게이트가 열리지 않으며 D 시나리오로 연결. 구조대가 전원 미복구 사실을 깨닫고 재가동 임무 수행\n• 재난 중 힘캐의 실수로 고립자가 생기며 구조작전 확대\n• 클라이맥스: 중앙 코어 천장이 대붕괴. 마지막 대원이 남아 모두가 탈출 실패로 생각하지만 마지막 순간 열차에 탑승해 전원 생존\n• 안전 키월드 도착 후 주민·구조대 모두 서로를 확인하고 안도하며 기뻐함\n• 2차 재난: 환호 중 꼬마 얼굴에 작은 파편이 떨어짐. 꼬마가 ‘어? 뭐지?’ 하고 위를 보는 순간 천장이 다시 흔들림\n• 현실 공개: 거대한 키 눌림 충격음과 실제 타건음을 매치컷. 카메라가 세계 밖으로 빠져나가 모찌의 손과 ABKO MK108 공개\n• 엔딩: 다른 키월드에도 경보가 번지며 2편 암시\n• 러닝타임은 5분을 억지로 맞추지 않고 감정·코미디·재난 호흡에 따라 5분 이상 허용`;const STORY=[{title:'오프닝',desc:'중앙 코어 전경, 평화로운 아침, 주민 일상과 구조대 5명 코미디 소개',time:'0:00~0:55'},{title:'아침 임무',desc:'게이트 정기점검 출동. 생활사고 구조와 축제·출근 혼잡 질서 정리로 팀워크와 세계 소개',time:'0:55~1:45'},{title:'이상 전조',desc:'점검 종료 직전 미세 이상신호가 발생했다 사라짐. 게이트 전원 재가동 누락 복선',time:'1:45~2:10'},{title:'첫 재난',desc:'코어 조명 이상→미세진동→통신 끊김→붉은 경보→강한 충격. 도시 대피 시작',time:'2:10~3:00'},{title:'게이트 재가동',desc:'대피 게이트가 열리지 않음. 구조대가 전원 미복구를 깨닫고 붕괴 지역으로 복귀, 고립자 구조까지 수행',time:'3:00~4:10'},{title:'대붕괴·탈출',desc:'중앙 코어 천장 대붕괴. 마지막 대원이 뒤처져 모두 절망하지만 마지막 순간 열차에 올라 전원 탈출',time:'4:10~5:05'},{title:'안전 키월드',desc:'주민과 구조대가 서로 생존을 확인하고 환호. 긴장을 풀어주는 짧은 코미디',time:'5:05~5:35'},{title:'2차 재난·현실 공개',desc:'꼬마 얼굴에 파편→위를 봄→천장 흔들림. 키 눌림 충격음과 타건음을 매치해 모찌의 손과 ABKO MK108 공개',time:'5:35~6:05'},{title:'엔딩',desc:'다른 키월드에도 경보가 번지며 2편 암시',time:'6:05~6:15'}];let db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"active":null}');function current(){return db.projects.find(p=>p.id===db.active)||db.projects[0]||null}function apply(){const p=current();if(!p)return null;if(!p.roadmap)p.roadmap={};if(!p.roadmap.map)p.roadmap.map={done:false,note:''};if(!p.roadmap.story)p.roadmap.story={done:false,note:''};p.roadmap.map.done=true;p.roadmap.map.note=STAGE6;p.roadmap.story.done=true;p.roadmap.story.note=STAGE7;p.story=STORY;p.storyConfirmedVersion=1;p.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(db));return p}function render(){const p=apply();document.getElementById('stage6').textContent=STAGE6;document.getElementById('stage7').textContent=STAGE7;if(!p)document.getElementById('state').textContent='먼저 작업실에서 프로젝트를 만들어주세요.'}render();</script></body></html>
