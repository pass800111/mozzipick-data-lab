<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEY WORLD 단계별 체크리스트</title><style>:root{--bg:#0b1020;--panel:#121a2f;--line:#2b3757;--text:#f4f7ff;--muted:#9eabc6;--accent:#7c9cff;--ok:#37c991;--warn:#ffcc66}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0f1d,#0d1426 55%,#0a0f1d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:rgba(18,26,47,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.done{border-color:var(--ok)}.current{border-color:var(--warn)}h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);font-size:13px}.stage{font-size:12px;margin-bottom:10px}.done .stage{color:#7be0b5}.current .stage{color:#ffe3a1}.summary{white-space:pre-wrap;background:#0e1629;border:1px solid #33415f;border-radius:12px;padding:14px;font-size:13px;line-height:1.72;color:#dce5ff}.group{padding:14px 0;border-top:1px solid #2b3757}.group:first-child{border-top:0}.group h3{margin:0 0 8px;font-size:15px}.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid transparent;border-radius:10px;background:#11192d;margin:8px 0}.opt:has(input:checked){border-color:var(--ok);background:#12271f}.opt input{width:19px;height:19px;accent-color:var(--ok)}textarea{width:100%;margin-top:8px;min-height:70px;background:#0e1629;color:var(--text);border:1px solid #33415f;border-radius:12px;padding:12px;font:inherit;resize:vertical}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#071022;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex}.ghost{background:#202b49;color:#dce5ff;border:1px solid #334163}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.saved{color:var(--ok);font-size:13px}.out{white-space:pre-wrap;background:#0e1629;border:1px solid #33415f;border-radius:12px;padding:14px;min-height:90px;font-size:13px;line-height:1.6}details summary{cursor:pointer;font-weight:800;color:#dce5ff}</style></head><body><div class="wrap"><h1>KEY WORLD 단계별 체크리스트</h1><p>결정이 확정되면 에이스가 완료 처리하고 다음 단계로 넘깁니다.</p><details class="card done"><summary>✓ 8단계 완료 · 스토리보드 CUT 방향</summary><div id="stage8" class="summary" style="margin-top:12px"></div></details><div class="card current"><div class="stage">● 현재 단계 · 9. FINAL 레퍼런스 이미지</div><p>한 장에 한 목적만 담는 FINAL 기준 이미지를 정합니다. 이후 모든 영상 생성은 이 이미지와 MASTER LOCK을 기준으로 맞춥니다.</p><div id="groups"></div></div><div class="card"><h3>9단계 기타 / 내 생각</h3><textarea id="free" placeholder="레퍼런스 이미지에서 꼭 지켜야 할 구도·표정·배경·제품 정확성 등을 적어주세요"></textarea></div><div class="bar"><span class="saved" id="state">✓ 8단계 확정 저장됨</span><button class="btn ghost" id="saveBtn">저장</button><button class="btn" id="copyBtn">9단계 선택 내용 복사</button><a class="btn ghost" href="./roadmap.html">제작 로드맵</a></div><div id="out" class="out">9단계를 선택한 뒤 '9단계 선택 내용 복사'를 누르세요.</div></div><script>const KEY='ai-video-studio-v01';const STAGE8=`• 전체 밀도: 약 55~70 CUT의 영화형 균형. 중요한 감정 장면은 길게 유지\n• 오프닝: 거대한 돔·중앙 코어 초광각 항공샷 → 카메라가 도시 속 집 안으로 빠르게 이동 → 늦잠 자는 대장에게 연결\n• 대장을 주인공급 중심 캐릭터로 운용\n• 전체 감성: 활기찬 대도시 애니메이션 영화처럼 도시의 생활감과 캐릭터 코미디를 살리되 KEY WORLD 고유 디자인 유지\n• 구조대: 출근 후 본부에서 5명이 한 명씩 자연스럽게 등장. 물리 코미디와 성격 차이를 행동으로 표현\n• 생활사고/축제: 정기점검 이동 중 작은 구조사건과 축제·출근 혼잡을 한 흐름으로 연결\n• 첫 재난: 코어 → 주민 → 구조대 → 돔 천장 순서로 규모 확대. 붉은 경보 이후 빠른 컷과 넓은 재난 전경 교차\n• 게이트 작전: 대장·기술병 지휘/판단, 엔지니어 전원복구, 힘캐 현장돌파, 신입 예상 밖 도움. 마지막에 전원 재집결\n• 마지막 탈출: 모두 포기한 정적 뒤 먼 곳에서 마지막 대원이 등장하고 음악이 다시 살아남\n• 2차 재난: 충분한 환호 → 꼬마 얼굴 파편 클로즈업 → ‘어? 뭐지?’ → 1~2초 정적 → 강한 천장 충격 → 바로 현실세계 전환\n• 현실 공개: 충격음 매치컷 → 현실세계 매크로 타건샷 → 와이드샷으로 ABKO MK108 + 모찌 공개`;const REFS=[['refCount','FINAL 레퍼런스 이미지 구성',['핵심 11장: 주요 씬마다 기준 이미지 1장','확장 16장: 주요 씬 + 재난 전/후 상태를 별도 제작','최소 8장: 꼭 필요한 장면만 압축']],['refFormat','기본 화면 비율',['16:9 YouTube 영화형을 기준으로 제작','2.39:1 시네마스코프 구도로 제작 후 16:9에 배치','16:9 기준이지만 일부 히어로샷만 더 넓은 시네마 구도']],['refStyle','비주얼 스타일 기준',['실사 영화처럼 보이는 하이엔드 3D/CGI, AI티 최소화','애니메이션 영화 감성의 활기찬 도시 연출 + 재질과 조명은 사실적','SF 블록버스터 비중을 높여 더 묵직하고 사실적으로']],['refOpening','오프닝 기준 이미지',['돔 전체+중앙 코어 항공샷','도시 상공에서 대장 집으로 진입하기 직전 외관샷','늦잠 자는 대장 침실 내부 기준샷']],['refTeam','구조대 기준 이미지',['구조대 본부 5명 전체 그룹 기준샷','대장 단독 히어로 기준샷 추가','5명 각각 개별 표정/장비 기준 이미지까지 제작']],['refCity','도시 일상 기준 이미지',['축제·출근 혼잡이 함께 보이는 생활구역 와이드샷','작은 생활사고 구조 현장 기준샷','게이트 정기점검 현장 기준샷']],['refDisaster','재난 기준 이미지',['첫 경보 직전 정상 코어 + 경보 후 붉은 코어 2장','돔 천장 붕괴와 중앙 코어 대붕괴를 별도 기준샷으로 제작','게이트 전원 복구 현장 + 마지막 열차 탈출 장면을 별도 제작']],['refSafe','안전 키월드 기준 이미지',['주민과 구조대의 안도·환호 와이드샷','꼬마 얼굴 파편 클로즈업','2차 재난이 다시 시작되는 천장 충격샷']],['refReal','현실세계/MK108 기준 이미지',['모찌 손의 MK108 매크로 타건샷','모찌 + MK108 전체 게임 데스크 와이드샷','제품만 정확하게 보이는 MK108 히어로샷도 별도 제작']]];let db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"active":null}');function current(){return db.projects.find(p=>p.id===db.active)||db.projects[0]||null}function ensure(){const p=current();if(!p)return null;if(!p.keyworldExtra)p.keyworldExtra={};REFS.forEach(([id])=>{if(!p.keyworldExtra[id])p.keyworldExtra[id]={selected:[],thought:''}});if(!p.keyworldExtra.refFree)p.keyworldExtra.refFree='';if(!p.roadmap)p.roadmap={};if(!p.roadmap.storyboard)p.roadmap.storyboard={done:false,note:''};p.roadmap.storyboard.done=true;p.roadmap.storyboard.note=STAGE8;p.updated=Date.now();return p}function save(){const p=ensure();if(!p)return;localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('state').textContent='✓ 저장됨 '+new Date().toLocaleTimeString('ko-KR')}function render(){const p=ensure();document.getElementById('stage8').textContent=STAGE8;if(!p){document.getElementById('groups').innerHTML='먼저 작업실에서 프로젝트를 만들어주세요.';return}document.getElementById('groups').innerHTML=REFS.map(([id,title,opts],i)=>`<div class="group"><h3>${i+1}. ${title}</h3>${opts.map(o=>`<label class="opt"><input type="checkbox" data-id="${id}" data-v="${o}" ${p.keyworldExtra[id].selected.includes(o)?'checked':''}><span>${o}</span></label>`).join('')}<textarea data-thought="${id}" placeholder="기타 / 내 생각">${p.keyworldExtra[id].thought||''}</textarea></div>`).join('');document.getElementById('free').value=p.keyworldExtra.refFree||'';document.querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=e=>{const id=e.target.dataset.id,v=e.target.dataset.v,arr=p.keyworldExtra[id].selected;if(e.target.checked&&!arr.includes(v))arr.push(v);if(!e.target.checked)p.keyworldExtra[id].selected=arr.filter(x=>x!==v);save()});document.querySelectorAll('[data-thought]').forEach(el=>el.oninput=e=>{p.keyworldExtra[e.target.dataset.thought].thought=e.target.value;save()});document.getElementById('free').oninput=e=>{p.keyworldExtra.refFree=e.target.value;save()};save()}function text(){const p=ensure();if(!p)return '';let s='[KEY WORLD] 9단계 FINAL 레퍼런스 이미지 체크리스트\n\n';REFS.forEach(([id,title])=>{s+=title+'\n';(p.keyworldExtra[id].selected||[]).forEach(v=>s+='- '+v+'\n');if(p.keyworldExtra[id].thought)s+='기타/내 생각: '+p.keyworldExtra[id].thought+'\n';s+='\n'});if(p.keyworldExtra.refFree)s+='9단계 기타 / 내 생각\n'+p.keyworldExtra.refFree+'\n';return s}document.getElementById('saveBtn').onclick=save;document.getElementById('copyBtn').onclick=async()=>{const t=text();document.getElementById('out').textContent=t;try{await navigator.clipboard.writeText(t);document.getElementById('state').textContent='✓ 복사됨'}catch{document.getElementById('state').textContent='아래 내용을 직접 복사하세요'}};render();</script></body></html>
