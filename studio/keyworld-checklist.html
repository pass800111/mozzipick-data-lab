<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KEY WORLD 추가 체크리스트</title>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--line:#2b3757;--text:#f4f7ff;--muted:#9eabc6;--accent:#7c9cff;--ok:#37c991}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0f1d,#0d1426 55%,#0a0f1d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:rgba(18,26,47,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);font-size:13px}.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid transparent;border-radius:10px;background:#11192d;margin:8px 0}.opt:has(input:checked){border-color:var(--ok);background:#12271f}.opt input{width:19px;height:19px;accent-color:var(--ok)}textarea{width:100%;margin-top:10px;min-height:80px;background:#0e1629;color:var(--text);border:1px solid #33415f;border-radius:12px;padding:12px;font:inherit;resize:vertical}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#071022;font-weight:800;cursor:pointer}.ghost{background:#202b49;color:#dce5ff;border:1px solid #334163}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.saved{color:var(--ok);font-size:13px}.out{white-space:pre-wrap;background:#0e1629;border:1px solid #33415f;border-radius:12px;padding:14px;min-height:100px;font-size:13px;line-height:1.55}
</style>
</head>
<body><div class="wrap">
<h1>KEY WORLD 추가 체크리스트</h1><p>이번에 새로 정할 3가지만 체크하세요. 같은 브라우저에 자동 저장됩니다.</p>
<div id="groups"></div>
<div class="card"><h3>기타 / 추가 아이디어</h3><textarea id="free" placeholder="구조대 캐릭터, 키월드, 첫 편 무대에 대한 생각을 자유롭게 적어주세요"></textarea></div>
<div class="bar"><span class="saved" id="state">✓ 자동 저장</span><button class="btn ghost" id="saveBtn">저장</button><button class="btn" id="copyBtn">선택 내용 복사</button></div>
<div id="out" class="out">체크한 뒤 '선택 내용 복사'를 누르세요.</div>
</div>
<script>
const KEY='ai-video-studio-v01';
const EXTRA=[
['rescueSize','구조대 인원',['3명','4명','5명']],
['worldCompare','새로운 키월드 디자인 비교',['현재 A안만 유지','현재 A안 + 수직도시 B안 비교','현재 A안 + 거대 돔 C안 비교','A/B/C 모두 시안 제작']],
['firstStage','첫 편의 주 무대',['Q 키월드','Space 키월드','Enter 키월드','다른 키월드']]
];
let db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"active":null}');
function current(){return db.projects.find(p=>p.id===db.active)||db.projects[0]||null}
function ensure(){const p=current();if(!p)return null;if(!p.keyworldExtra)p.keyworldExtra={};EXTRA.forEach(([id])=>{if(!p.keyworldExtra[id])p.keyworldExtra[id]={selected:[],thought:''}});if(!p.keyworldExtra.free)p.keyworldExtra.free='';return p}
function save(){const p=ensure();if(!p)return;localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('state').textContent='✓ 저장됨 '+new Date().toLocaleTimeString('ko-KR')}
function render(){const p=ensure();if(!p){document.getElementById('groups').innerHTML='<div class="card">먼저 영상 제작소에서 프로젝트를 만들어주세요.</div>';return}
 document.getElementById('groups').innerHTML=EXTRA.map(([id,title,opts],gi)=>`<div class="card"><h3>${gi+1}. ${title}</h3>${opts.map(o=>`<label class="opt"><input type="checkbox" data-id="${id}" data-v="${o}" ${p.keyworldExtra[id].selected.includes(o)?'checked':''}><span>${o}</span></label>`).join('')}<textarea data-thought="${id}" placeholder="기타 / 내 생각">${p.keyworldExtra[id].thought||''}</textarea></div>`).join('');
 document.getElementById('free').value=p.keyworldExtra.free||'';
 document.querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=e=>{const id=e.target.dataset.id,v=e.target.dataset.v,arr=p.keyworldExtra[id].selected;if(e.target.checked&&!arr.includes(v))arr.push(v);if(!e.target.checked)p.keyworldExtra[id].selected=arr.filter(x=>x!==v);save()});
 document.querySelectorAll('[data-thought]').forEach(el=>el.oninput=e=>{p.keyworldExtra[e.target.dataset.thought].thought=e.target.value;save()});
 document.getElementById('free').oninput=e=>{p.keyworldExtra.free=e.target.value;save()};
}
function text(){const p=ensure();if(!p)return '';let s='[KEY WORLD] 추가 체크리스트\n\n';EXTRA.forEach(([id,title])=>{s+=title+'\n';(p.keyworldExtra[id].selected||[]).forEach(v=>s+='- '+v+'\n');if(p.keyworldExtra[id].thought)s+='기타/내 생각: '+p.keyworldExtra[id].thought+'\n';s+='\n'});if(p.keyworldExtra.free)s+='기타 / 추가 아이디어\n'+p.keyworldExtra.free+'\n';return s}
document.getElementById('saveBtn').onclick=save;document.getElementById('copyBtn').onclick=async()=>{const t=text();document.getElementById('out').textContent=t;try{await navigator.clipboard.writeText(t);document.getElementById('state').textContent='✓ 복사됨'}catch{document.getElementById('state').textContent='아래 내용을 직접 복사하세요'}};render();
</script></body></html>
