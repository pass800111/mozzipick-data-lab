<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEY WORLD 단계별 체크리스트</title><style>:root{--bg:#0b1020;--panel:#121a2f;--line:#2b3757;--text:#f4f7ff;--muted:#9eabc6;--accent:#7c9cff;--ok:#37c991;--warn:#ffcc66}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0f1d,#0d1426 55%,#0a0f1d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:rgba(18,26,47,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.done{border-color:var(--ok)}.current{border-color:var(--warn)}h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);font-size:13px}.stage{font-size:12px;margin-bottom:10px}.done .stage{color:#7be0b5}.current .stage{color:#ffe3a1}.summary{white-space:pre-wrap;background:#0e1629;border:1px solid #33415f;border-radius:12px;padding:14px;font-size:13px;line-height:1.72;color:#dce5ff}.group{padding:14px 0;border-top:1px solid #2b3757}.group:first-child{border-top:0}.group h3{margin:0 0 8px;font-size:15px}.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid transparent;border-radius:10px;background:#11192d;margin:8px 0}.opt:has(input:checked){border-color:var(--ok);background:#12271f}.opt input{width:19px;height:19px;accent-color:var(--ok)}textarea{width:100%;margin-top:8px;min-height:70px;background:#0e1629;color:var(--text);border:1px solid #33415f;border-radius:12px;padding:12px;font:inherit;resize:vertical}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#071022;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex}.ghost{background:#202b49;color:#dce5ff;border:1px solid #334163}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.saved{color:var(--ok);font-size:13px}.out{white-space:pre-wrap;background:#0e1629;border:1px solid #33415f;border-radius:12px;padding:14px;min-height:90px;font-size:13px;line-height:1.6}details summary{cursor:pointer;font-weight:800;color:#dce5ff}</style></head><body><div class="wrap"><h1>KEY WORLD 단계별 체크리스트</h1><p>결정이 확정되면 에이스가 완료 처리하고 다음 단계로 넘깁니다.</p><details class="card done"><summary>✓ 7단계 완료 · 스토리 구조</summary><div id="stage7" class="summary" style="margin-top:12px"></div></details><div class="card current"><div class="stage">● 현재 단계 · 8. 스토리보드 CUT</div><p>이번 단계는 실제 영상 제작 전에 러프 CUT을 확정합니다. 씬마다 구도·카메라·행동·연속성을 먼저 잡고, 이후 FINAL 레퍼런스로 넘어갑니다.</p><div id="groups"></div></div><div class="card"><h3>8단계 기타 / 내 생각</h3><textarea id="free" placeholder="꼭 넣고 싶은 샷, 카메라 움직임, 코미디 장면, 재난 장면 등을 적어주세요"></textarea></div><div class="bar"><span class="saved" id="state">✓ 자동 저장</span><button class="btn ghost" id="saveBtn">저장</button><button class="btn" id="copyBtn">8단계 선택 내용 복사</button><a class="btn ghost" href="./roadmap.html">제작 로드맵</a></div><div id="out" class="out">8단계를 선택한 뒤 '8단계 선택 내용 복사'를 누르세요.</div></div><script>const KEY='ai-video-studio-v01';const STAGE7=`• 중앙 코어 전경 → 평화로운 Q 키월드 아침 → 구조대 5명 코미디\n• 정기점검 출동 중 생활사고 구조와 축제/출근 혼잡 정리\n• 점검 종료 직전 이상신호가 잠깐 나타났다 사라짐\n• 게이트 전원 재가동 누락이 후반 복선\n• 코어 이상 연쇄형(B) → 게이트 미작동 복선 회수형(D)으로 연결\n• 구조대가 재가동 임무와 고립자 구조 수행\n• 중앙 코어 천장 대붕괴, 마지막 대원이 마지막 순간 열차 탑승\n• 안전 키월드에서 안도와 환호\n• 꼬마 얼굴에 파편 → 위를 봄 → 2차 재난\n• 타건음 매치컷으로 모찌의 손 + ABKO MK108 공개\n• 다른 키월드 경보로 2편 암시\n• 러닝타임은 약 6분 전후, 필요 시 더 길어져도 됨`;const CUTS=[['cutDensity','전체 CUT 밀도',['영화형 균형: 약 55~70 CUT, 중요한 감정 장면은 길게 유지','빠른 템포: 약 75~90 CUT, 코미디와 재난을 빠르게 전환','느린 영화형: 약 40~55 CUT, 공간과 감정을 오래 보여줌']],['cutOpening','오프닝 촬영 방식',['거대한 돔·중앙 코어의 초광각 항공샷으로 시작','아침 햇빛이 도시를 훑는 롱테이크 후 주민 일상으로 내려감','구조대 5명의 개별 행동을 짧게 교차편집 후 도시 전경 공개']],['cutComedy','구조대 코미디 표현',['대사보다 행동·표정·타이밍 중심','5명 각자의 성격을 한 번씩 명확하게 보여주는 개별 샷','서로 부딪치거나 장비를 잘못 건드리는 물리 코미디 포함']],['cutIncident','생활사고/축제 구간',['작은 생활사고 1건을 실제 구조 장면으로 보여줌','축제·출근 혼잡을 도시 전경과 군중 리액션으로 크게 보여줌','정기점검 이동 중 사건과 축제를 한 흐름 안에서 자연스럽게 연결']],['cutDisaster','첫 재난 촬영 강도',['초반은 거의 고정카메라·정적, 이상징후부터 카메라 흔들림 증가','코어→주민→구조대→돔 천장 순서로 규모를 점점 크게 확장','붉은 경보 후부터 빠른 컷과 넓은 재난 전경을 교차']],['cutRescue','게이트 재가동/구조 작전',['대장·기술병은 지휘/판단, 엔지니어는 전원 복구, 힘캐는 현장 돌파, 신입은 예상 밖의 도움','구조대 5명을 두 팀으로 나눠 게이트 복구와 고립자 구조를 동시에 진행','마지막에는 다시 전원이 한곳에 모여 열차 탈출']],['cutClimax','마지막 대원 탈출 연출',['열차 문이 닫히기 직전 마지막 대원이 달려와 뛰어오름','열차가 이미 움직인 뒤 마지막 대원이 선로를 달려 측면 손잡이를 잡음','모두 포기한 정적 뒤 먼 곳에서 마지막 대원이 나타나고 음악이 다시 살아남']],['cutSecond','2차 재난 연결',['환호를 충분히 보여준 뒤 꼬마 얼굴 파편 클로즈업','꼬마의 “어? 뭐지?” 뒤 완전한 정적 1~2초 후 천장 충격','첫 재난보다 짧고 강하게 터뜨린 뒤 바로 현실세계로 빠져나감']],['cutReveal','현실세계 공개 카메라',['키월드에서 카메라가 수직으로 빠져나가 키캡 내부→키보드 전체→모찌 손까지 연속 공개','충격음 매치컷 후 현실세계 매크로 타건샷 → 와이드샷으로 MK108과 모찌 공개','키월드 천장 흔들림을 키캡 움직임과 연결해 같은 움직임으로 현실세계 전환']]];let db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"active":null}');function current(){return db.projects.find(p=>p.id===db.active)||db.projects[0]||null}function ensure(){const p=current();if(!p)return null;if(!p.keyworldExtra)p.keyworldExtra={};CUTS.forEach(([id])=>{if(!p.keyworldExtra[id])p.keyworldExtra[id]={selected:[],thought:''}});if(!p.keyworldExtra.cutFree)p.keyworldExtra.cutFree='';if(!p.roadmap)p.roadmap={};if(!p.roadmap.story)p.roadmap.story={done:false,note:''};p.roadmap.story.done=true;p.roadmap.story.note=STAGE7;return p}function save(){const p=ensure();if(!p)return;localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('state').textContent='✓ 저장됨 '+new Date().toLocaleTimeString('ko-KR')}function render(){const p=ensure();if(!p){document.getElementById('groups').innerHTML='먼저 작업실에서 프로젝트를 만들어주세요.';return}document.getElementById('stage7').textContent=STAGE7;document.getElementById('groups').innerHTML=CUTS.map(([id,title,opts],i)=>`<div class="group"><h3>${i+1}. ${title}</h3>${opts.map(o=>`<label class="opt"><input type="checkbox" data-id="${id}" data-v="${o}" ${p.keyworldExtra[id].selected.includes(o)?'checked':''}><span>${o}</span></label>`).join('')}<textarea data-thought="${id}" placeholder="기타 / 내 생각">${p.keyworldExtra[id].thought||''}</textarea></div>`).join('');document.getElementById('free').value=p.keyworldExtra.cutFree||'';document.querySelectorAll('input[type=checkbox]').forEach(el=>el.onchange=e=>{const id=e.target.dataset.id,v=e.target.dataset.v,arr=p.keyworldExtra[id].selected;if(e.target.checked&&!arr.includes(v))arr.push(v);if(!e.target.checked)p.keyworldExtra[id].selected=arr.filter(x=>x!==v);save()});document.querySelectorAll('[data-thought]').forEach(el=>el.oninput=e=>{p.keyworldExtra[e.target.dataset.thought].thought=e.target.value;save()});document.getElementById('free').oninput=e=>{p.keyworldExtra.cutFree=e.target.value;save()};save()}function text(){const p=ensure();if(!p)return '';let s='[KEY WORLD] 8단계 스토리보드 CUT 체크리스트\n\n';CUTS.forEach(([id,title])=>{s+=title+'\n';(p.keyworldExtra[id].selected||[]).forEach(v=>s+='- '+v+'\n');if(p.keyworldExtra[id].thought)s+='기타/내 생각: '+p.keyworldExtra[id].thought+'\n';s+='\n'});if(p.keyworldExtra.cutFree)s+='8단계 기타 / 내 생각\n'+p.keyworldExtra.cutFree+'\n';return s}document.getElementById('saveBtn').onclick=save;document.getElementById('copyBtn').onclick=async()=>{const t=text();document.getElementById('out').textContent=t;try{await navigator.clipboard.writeText(t);document.getElementById('state').textContent='✓ 복사됨'}catch{document.getElementById('state').textContent='아래 내용을 직접 복사하세요'}};render();</script></body></html>
