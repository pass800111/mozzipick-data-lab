<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KEY WORLD 단계별 체크리스트</title>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--line:#2b3757;--text:#f4f7ff;--muted:#9eabc6;--accent:#7c9cff;--ok:#37c991;--warn:#ffcc66}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0f1d,#0d1426 55%,#0a0f1d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:rgba(18,26,47,.96);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.done{border-color:var(--ok)}.next{border-color:var(--warn)}h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);font-size:13px}.stage{font-size:12px;margin-bottom:10px}.done .stage{color:#7be0b5}.next .stage{color:#ffe3a1}.summary{white-space:pre-wrap;background:#0e1629;border:1px solid #33415f;border-radius:12px;padding:14px;font-size:13px;line-height:1.7;color:#dce5ff}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#071022;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex}.ghost{background:#202b49;color:#dce5ff;border:1px solid #334163}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.saved{color:var(--ok);font-size:13px}.old{opacity:.76}details summary{cursor:pointer;font-weight:800;color:#dce5ff}.pill{display:inline-block;border:1px solid #3a496c;border-radius:999px;padding:5px 8px;margin:3px;font-size:11px;color:#dce5ff;background:#151f36}
</style>
</head>
<body><div class="wrap">
<h1>KEY WORLD 단계별 체크리스트</h1><p>결정이 확정되면 에이스가 자동으로 완료 처리하고 다음 단계로 넘깁니다.</p>
<div class="card done"><div class="stage">✓ 6단계 완료 · 맵 · 동선 · 연속성 설계</div><div id="stage6" class="summary"></div></div>
<div class="card next"><div class="stage">● 다음 단계 · 7. 5분 스토리 구조</div><b>다음 작업은 전체 5분 이야기 구조 확정입니다.</b><p>오프닝 → 일상 → 첫 충격 → 경보 → 대피 → 구조 → 열차 탈출 → 안전 키월드 → 2차 재난 → 현실세계/MK108 공개 순서로 설계합니다.</p></div>
<details class="card old"><summary>이전 단계 선택 기록 펼치기</summary><div id="oldSummary" style="margin-top:12px"></div></details>
<div class="bar"><span class="saved" id="state">✓ 6단계 확정 저장됨</span><a class="btn ghost" href="./roadmap.html">제작 로드맵</a><a class="btn ghost" href="./">작업실</a></div>
</div>
<script>
const KEY='ai-video-studio-v01';
const CONFIRMED={
 mapCore:['돔 정중앙'],
 mapRescueBase:['중앙 코어 바로 옆'],
 mapStation:['돔 가장자리 출구 직결역'],
 mapResidential:['중앙에서 외곽으로 퍼지는 방사형 도시','여러 층으로 나뉜 테라스형 도시'],
 mapEvacRoute:['주거구역 → 여러 소형역 → 중앙 환승 → 안전키','주거구역 → 중앙역 → 안전키 게이트'],
 mapEmergency:['보조통로 없이 열차만 사용'],
 mapGate:['게이트 진입 후 초고속 튜브로 다른 키월드까지 이동'],
 mapDisaster:['중앙 코어 주변','돔 상층/천장 구조']
};
const LABELS={mapCore:'중앙 코어 위치',mapRescueBase:'구조대 기지 위치',mapStation:'고속열차역 위치',mapResidential:'주민 생활구역 배치',mapEvacRoute:'기본 대피 동선',mapEmergency:'비상 보조통로',mapGate:'안전키 연결 게이트',mapDisaster:'재난 때 먼저 위험해지는 구역'};
const NOTE=`• 중앙 코어: 돔 정중앙\n• 구조대 기지: 중앙 코어 바로 옆\n• 고속열차역: 돔 가장자리 출구 직결역\n• 생활구역: 방사형 + 다층 테라스형 도시\n• 대피: 소형역 분산 집결 또는 중앙역 직행의 2중 대피 체계\n• 보조통로 없음, 열차 중심\n• 게이트 진입 후 초고속 튜브로 다른 키월드 이동\n• 최초 위험구역: 중앙 코어 주변 + 돔 상층/천장\n• 핵심 재난 비주얼: 중앙 코어 천장이 붕괴되며 아래로 내려앉음`;
let db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"active":null}');
function current(){return db.projects.find(p=>p.id===db.active)||db.projects[0]||null}
function apply(){const p=current();if(!p)return null;if(!p.keyworldExtra)p.keyworldExtra={};Object.entries(CONFIRMED).forEach(([id,selected])=>{p.keyworldExtra[id]={selected:[...selected],thought:id==='mapDisaster'?'중앙 코어 천정이 붕괴돼면서 내려 앉는다':''}});p.keyworldExtra.mapFree='';if(!p.roadmap)p.roadmap={};if(!p.roadmap.map)p.roadmap.map={done:false,note:''};p.roadmap.map.done=true;p.roadmap.map.note=NOTE;p.mapConfirmedVersion=1;p.updated=Date.now();localStorage.setItem(KEY,JSON.stringify(db));return p}
function render(){const p=apply();if(!p){document.getElementById('stage6').textContent='먼저 작업실에서 프로젝트를 만들어주세요.';return}document.getElementById('stage6').textContent=NOTE;const prior=[];if(p.keyworldExtra){['rescueSize','worldCompare','firstStage','rescueRoles','escapeVehicle','safeZone'].forEach(id=>{const d=p.keyworldExtra[id];if(d&&Array.isArray(d.selected)&&d.selected.length)prior.push(`<div style="margin-bottom:8px"><b>${id}</b><br>${d.selected.map(v=>`<span class="pill">${v}</span>`).join('')}</div>`)});}document.getElementById('oldSummary').innerHTML=prior.length?prior.join(''):'이전 선택 기록은 로드맵의 각 단계에서 확인할 수 있습니다.'}
render();
</script></body></html>
