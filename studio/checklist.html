<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI 영상 제작소 · 체크리스트 확인</title>
<style>
:root{--panel:#121a2f;--line:#2b3757;--text:#f4f7ff;--muted:#9eabc6;--accent:#7c9cff;--ok:#37c991}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0f1d,#0d1426);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--accent);color:#071022}.btn.ghost{background:#202b49;color:#dce5ff;border:1px solid #334163}.title{margin:0;font-size:23px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.group h3{margin:0 0 8px;font-size:15px}.selected{display:flex;flex-wrap:wrap;gap:7px}.tag{background:#12271f;border:1px solid var(--ok);color:#dff9ef;border-radius:999px;padding:6px 10px;font-size:13px}.none{color:var(--muted);font-size:13px}.thought{margin-top:10px;background:#0e1629;border:1px solid #33415f;border-radius:10px;padding:10px;white-space:pre-wrap;line-height:1.5}.label{color:var(--muted);font-size:12px;margin-bottom:5px}.notice{padding:12px;border-radius:12px;background:#11192d;border:1px solid var(--line);color:var(--muted);font-size:13px;margin-bottom:14px}.ok{color:var(--ok)}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1 class="title">🎬 체크리스트 확인</h1><div class="sub" id="projectName">프로젝트 불러오는 중...</div></div><div><button class="btn ghost" onclick="location.href='./'">제작소로</button> <button class="btn" id="copyBtn">전체 복사</button></div></div>
<div class="notice">현재 브라우저에 저장된 체크 내용을 읽습니다. <span class="ok">선택 항목 + 기타 의견</span>만 보기 쉽게 정리합니다.</div>
<div id="out"></div>
</div>
<script>
const KEY='ai-video-studio-v01';
const GROUPS=[['tone','전체 분위기'],['world','키월드 디자인'],['citizen','주민 디자인'],['hero','주인공'],['cause','비상사태 원인'],['disaster','재난 장면'],['evac','대피 방식'],['zones','키보드 구역 설정'],['tower','중앙 타워 역할'],['human','인간 세계 공개 시점'],['ending','엔딩'],['ad','광고 느낌'],['style','영상 스타일'],['series','시리즈화']];
const db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"active":null}');
const p=db.projects.find(x=>x.id===db.active);
const out=document.getElementById('out');
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function textReport(){if(!p)return '선택된 프로젝트가 없습니다.';let lines=[`[${p.name||'제목 없음'}] 기획 체크리스트`];for(const [id,title] of GROUPS){const g=p.checklist?.[id]||{selected:[],thought:''};if(g.selected?.length||g.thought?.trim()){lines.push(`\n${title}`);(g.selected||[]).forEach(v=>lines.push(`- ${v}`));if(g.thought?.trim())lines.push(`기타/내 생각: ${g.thought.trim()}`)}}const free=p.checklist?.free?.thought?.trim();if(free)lines.push(`\n전체 아이디어 / 꼭 넣고 싶은 내용\n${free}`);return lines.join('\n')}
function render(){if(!p){document.getElementById('projectName').textContent='선택된 프로젝트가 없습니다.';out.innerHTML='<div class="card none">제작소로 돌아가 프로젝트를 선택해주세요.</div>';document.getElementById('copyBtn').disabled=true;return}document.getElementById('projectName').textContent=p.name||'제목 없음';let html='';for(const [id,title] of GROUPS){const g=p.checklist?.[id]||{selected:[],thought:''};if(!(g.selected?.length||g.thought?.trim()))continue;html+=`<div class="card group"><h3>${esc(title)}</h3><div class="selected">${g.selected?.length?g.selected.map(v=>`<span class="tag">✓ ${esc(v)}</span>`).join(''):'<span class="none">선택 항목 없음</span>'}</div>${g.thought?.trim()?`<div class="thought"><div class="label">기타 / 내 생각</div>${esc(g.thought)}</div>`:''}</div>`}const free=p.checklist?.free?.thought?.trim();if(free)html+=`<div class="card group"><h3>전체 아이디어 / 꼭 넣고 싶은 내용</h3><div class="thought">${esc(free)}</div></div>`;out.innerHTML=html||'<div class="card none">작성된 체크리스트가 없습니다.</div>'}
document.getElementById('copyBtn').onclick=async()=>{const t=textReport();try{await navigator.clipboard.writeText(t);const b=document.getElementById('copyBtn');const old=b.textContent;b.textContent='✓ 복사됨';setTimeout(()=>b.textContent=old,1400)}catch{prompt('아래 내용을 복사하세요.',t)}};
render();
</script></body></html>
